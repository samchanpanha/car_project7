apiVersion: 1

groups:
  - orgId: 1
    name: KhLan Core
    folder: KhLan
    interval: 1m
    rules:
      - uid: khlan-5xx-alert
        title: Khlan HTTP 5xx rate high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-6) * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate is high ({{ $values.A }}%)"

      - uid: khlan-jvm-heap-alert
        title: Khlan JVM heap near full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                jvm_memory_used_bytes{area="heap"}
                / clamp_min(sum by (instance) (jvm_memory_max_bytes{area="heap"}), 1e-6) * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "JVM heap usage above 85% ({{ $values.A }}%)"
