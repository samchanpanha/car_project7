spring:
  application:
    name: khlan-backend
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        service: ${spring.application.name}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
        shared-configs:
          - data-id: khlan-storage.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: khlan-telegram.yaml
            group: DEFAULT_GROUP
            refresh: true
