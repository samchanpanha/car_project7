services:
  # -------------------------------------------------------------
  # NOTE: This blueprint predates the split into Next.js + Spring Boot
  # (PostgreSQL) and is NOT the canonical deployment today. The canonical
  # stack is docker-compose.yml (postgres + redis + minio + backend + web +
  # nginx + monitoring). Before using this file on Render:
  #   * DATABASE_URL must point to a real PostgreSQL instance (the Prisma
  #     schema is `postgresql`, not SQLite — the file:... value below will
  #     fail the build),
  #   * add the Spring Boot `backend` service and point the Next.js /api/*
  #     rewrite at it (the frontend expects `backend:8080`),
  #   * NEXTAUTH_* and ENABLE_TELEGRAM_DAEMON are unused by the current code
  #     and have been removed.
  # -------------------------------------------------------------
  - type: web
    name: khlan-marketplace
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      # Application & Database Configuration
      - key: NODE_ENV
        value: production
      # TODO: point at a managed PostgreSQL instance (Prisma expects postgresql).
      - key: DATABASE_URL
        value: postgresql://khlan:khlan_secret_2026@localhost:5432/khlandb
      # Canonical site origin for metadataBase, sitemap.xml and OG URLs.
      # Read at request time — change it here when the domain changes.
      - key: SITE_URL
        value: https://khlan-marketplace.onrender.com

      # Cloudflare R2 Persistent Storage (Free tier, zero egress cost)
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: cars-storage
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false

      # Telegram Integration (Optional)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
