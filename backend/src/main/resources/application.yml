server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: khlan-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/khlandb}
    username: ${SPRING_DATASOURCE_USERNAME:khlan}
    password: ${SPRING_DATASOURCE_PASSWORD:khlan_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# MinIO / Cloudflare R2 S3 Object Storage Configuration
minio:
  endpoint: ${CLOUDFLARE_R2_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${CLOUDFLARE_R2_ACCESS_KEY_ID:${MINIO_ACCESS_KEY:minioadmin}}
  secret-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:${MINIO_SECRET_KEY:minioadmin}}
  region: ${CLOUDFLARE_R2_REGION:auto}
  bucket:
    public: ${CLOUDFLARE_R2_BUCKET:cars-storage}
    private: ${CLOUDFLARE_R2_PRIVATE_BUCKET:cars-storage}
  public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

# Telegram Bot & Channel Configuration
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:8961155344:AAEXIEeSWNp4kudB2YQEnpj7hsUkd-ignAc}
  group-chat-id: ${TELEGRAM_GROUP_CHAT_ID:-1004489863210}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:khlan_webhook_secret_2026}

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:KhLanSuperSecretJwtKeyCambodiaMarketplace2026SecureToken}
  access-token-expiration-ms: 86400000 # 24 hours
  refresh-token-expiration-ms: 604800000 # 7 days

# Observability & Metrics
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
