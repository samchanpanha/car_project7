# WebSocket/HMR upgrade handshake support.
#
# `proxy_set_header Connection 'upgrade'` was previously hard-coded, which sends
# `Connection: upgrade` with an EMPTY `Upgrade` header on every ordinary request.
# That is an invalid hop-by-hop combination: it defeats upstream keepalive and can
# make proxied responses hang or be reset. This map emits `upgrade` only when the
# client actually requested one, and `close` otherwise.
#
# This file is included inside the `http` block by nginx.conf, so `map` is legal here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    # Empty value => nginx omits the Connection header entirely. Using the more
    # common `close` here would work for WebSockets but would disable the
    # `keepalive` connection pools declared on the upstreams below, forcing a
    # new TCP connection for every page and asset request.
    ''      '';
}

upstream frontend_upstream {
    server khlan-frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server khlan-backend:8080;
    keepalive 64;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 32;
}

upstream nacos_upstream {
    server khlan-nacos:8848;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Next.js App Router OCR Engine (Tesseract & Sharp slip scanner)
    location /api/ocr {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30M;
        # Tesseract OCR of a full-size bank slip can approach the route handler's
        # own 60s budget; nginx's default 60s read timeout would 504 first.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Never buffer an OCR response through a temp file.
        proxy_buffering off;
    }

    # Real-Time Server-Sent Events (SSE) Stream
    location /api/realtime/stream {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Enterprise Spring Boot Backend API (Vehicles, metadata, auth, admin, payments, etc.)
    location /api {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 30M;
    }

    # OpenAPI / Swagger UI
    location ~* ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MinIO Public Media (Car Photos, Logos)
    location /media/ {
        proxy_pass http://minio_upstream/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Alibaba Nacos Console & Service Discovery
    location /nacos {
        proxy_pass http://nacos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Frontend (SSR & Static Assets)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
