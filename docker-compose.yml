# -------------------------------------------------------------
# Shared security configuration for the app containers.
#
# The Next.js frontend signs/verifies the `khlan_auth` session cookie with
# `AUTH_SECRET` (src/lib/auth.ts) and the Spring Boot backend verifies the very
# same cookie with `AUTH_SECRET`/`jwt.secret` (SessionTokenService). They MUST
# receive an identical value or real logins silently fail — the backend used to
# fall back to a random UUID per boot while the frontend used its dev default,
# so no session cookie ever verified across the two containers.
#
# Set AUTH_SECRET once in your shell or .env; both services derive from it.
# -------------------------------------------------------------
x-app-security-env: &app-security-env
  AUTH_SECRET: ${AUTH_SECRET:-khlan-dev-secret-change-me}
  JWT_SECRET: ${AUTH_SECRET:-khlan-dev-secret-change-me}
  # Demo persona login (`khlan_persona` cookie / `x-khlan-persona` header).
  # Grants ANY caller the chosen persona — including usr_admin — with no
  # password. Keep this false unless you are deliberately running a demo.
  APP_DEMO_MODE: ${APP_DEMO_MODE:-false}

services:
  # -------------------------------------------------------------
  # Primary Database: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: khlan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: khlandb
      POSTGRES_USER: khlan
      POSTGRES_PASSWORD: khlan_secret_2026
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khlan -d khlandb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # In-Memory Cache & Distributed Lock: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: khlan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # S3 Object Storage: MinIO
  # -------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: khlan-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Service Discovery & Config Center: Alibaba Nacos
  # -------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: khlan-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/server/state | grep -q 'standalone' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Spring Boot 3.4 Backend (Java 21 LTS with Virtual Threads)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: khlan-backend:latest
    container_name: khlan-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *app-security-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/khlandb
      SPRING_DATASOURCE_USERNAME: khlan
      SPRING_DATASOURCE_PASSWORD: khlan_secret_2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-cars-storage}
      CLOUDFLARE_R2_PREFIX: ${CLOUDFLARE_R2_PREFIX:-}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8691160498:AAFkdDht6Wj7TAxRWxLTJPurDRP84BMwxb0}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-KhLanOfficialBot}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID:--1004489863210}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-khlan_webhook_secret_2026}
      TELEGRAM_LOCAL_POLLING: ${TELEGRAM_LOCAL_POLLING:-true}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      NACOS_CONFIG_ENABLED: "true"
      # Browser origins allowed to call the API with credentials. Behind the
      # NGINX gateway the origin is the gateway itself, not the Next.js port.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000}
      # Bearer secret required by /api/cron/** external triggers. Without it the
      # ABA reconciliation and subscription-reminder sweeps were world-triggerable.
      CRON_SECRET: ${CRON_SECRET:-khlan-cron-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      nacos:
        condition: service_healthy
    networks:
      khlan-net:
        aliases:
          - backend
          - khlan-backend

  # -------------------------------------------------------------
  # Next.js 15 Frontend Web Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      target: web
    container_name: khlan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      <<: *app-security-env
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://khlan:khlan_secret_2026@postgres:5432/khlandb}
      BACKEND_URL: http://backend:8080
      NACOS_SERVER_ADDR: nacos:8848
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-cars-storage}
      CLOUDFLARE_R2_PREFIX: ${CLOUDFLARE_R2_PREFIX:-}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8691160498:AAFkdDht6Wj7TAxRWxLTJPurDRP84BMwxb0}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-KhLanOfficialBot}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID:--1004489863210}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-khlan_webhook_secret_2026}
      TELEGRAM_LOCAL_POLLING: ${TELEGRAM_LOCAL_POLLING:-true}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/app/public
    networks:
      khlan-net:
        aliases:
          - frontend
          - khlan-frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  # -------------------------------------------------------------
  # Reverse Proxy, SSL, & API Gateway: NGINX
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: khlan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Metrics Scraping: Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: khlan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Log Aggregation: Grafana Loki
  # -------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: khlan-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Log Collector: Promtail
  # -------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: khlan-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Observability Dashboard: Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: khlan-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Optional local test tunnel (Cloudflare Quick Tunnel -> backend)
  # Start with: docker compose --profile tunnel up -d cloudflared
  # -------------------------------------------------------------
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: khlan-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--url", "http://nginx:80", "--no-autoupdate"]
    depends_on:
      nginx:
        condition: service_started
    networks:
      - khlan-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nacos-data:
  grafana-data:
  loki-data:

networks:
  khlan-net:
    name: khlan-net
    driver: bridge
