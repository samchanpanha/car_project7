services:
  # -------------------------------------------------------------
  # Primary Database: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: khlan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: khlandb
      POSTGRES_USER: khlan
      POSTGRES_PASSWORD: khlan_secret_2026
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khlan -d khlandb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # In-Memory Cache & Distributed Lock: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: khlan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # S3 Object Storage: MinIO
  # -------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: khlan-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Service Discovery & Config Center: Alibaba Nacos
  # -------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: khlan-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/server/state | grep -q 'standalone' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Spring Boot 3.4 Backend (Java 21 LTS with Virtual Threads)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: khlan-backend:latest
    container_name: khlan-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/khlandb
      SPRING_DATASOURCE_USERNAME: khlan
      SPRING_DATASOURCE_PASSWORD: khlan_secret_2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-cars-storage}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_DISCOVERY_ENABLED: "true"
      NACOS_CONFIG_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      nacos:
        condition: service_healthy
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Next.js 15 Frontend Web Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      target: web
    container_name: khlan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost/api
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-cars-storage}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
    depends_on:
      - backend
    volumes:
      - ./db:/app/db
      - ./public:/app/public
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Reverse Proxy, SSL, & API Gateway: NGINX
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: khlan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Metrics Scraping: Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: khlan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Log Aggregation: Grafana Loki
  # -------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: khlan-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Log Collector: Promtail
  # -------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: khlan-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - khlan-net

  # -------------------------------------------------------------
  # Observability Dashboard: Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: khlan-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - khlan-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nacos-data:
  grafana-data:
  loki-data:

networks:
  khlan-net:
    name: khlan-net
    driver: bridge
